name: CI

# Runs on EVERY push to ANY branch, and on every pull request.
# This is what makes the pipeline turnkey: the moment you push — whether
# it's a colour change to an existing component or a brand-new component
# scaffolded with `npm run scaffold` — the full gate runs and builds +
# tests it. No PR required to get a build; the PR just gates the merge.
#
# The build chain (lint → sync → vite → tsc → vitest → drift → storybook)
# enforces the design-system guardrails: a raw hex colour, a type error,
# a failing test, token drift, or a broken build fails the check.

on:
  push:
    branches: ['**']          # every branch — new component or update, it builds + tests
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older in-flight run, so
# rapid pushes don't pile up dozens of redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind output required by Storybook)
        run: npm run build:css

      - name: Lint (blocks raw hex + lint errors)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + a11y tests (Vitest)
        run: npm test

      - name: Token drift guard (blocks tokens.css drift from /tokens source)
        run: npm run test:tokens

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: ignore
