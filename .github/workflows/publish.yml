name: Publish to GitHub Packages

# Publishes @partssource/react-kit to GitHub Packages whenever you push a
# version tag (e.g. v0.1.0). Lint + build run first, so a rogue color or a
# broken build can never be published. Consuming apps then `npm install`
# the new version.
#
# To cut a release:
#   1. bump "version" in package.json (e.g. 0.1.0 -> 0.1.1)
#   2. git commit -am "Release v0.1.1"
#   3. git tag v0.1.1 && git push --tags
#
# The tag push triggers this workflow.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: npm

      - run: npm ci

      # The guardrail — a raw hex or type error stops the release here.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:css

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
